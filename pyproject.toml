[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-project"
version = "0.1.0"
description = "Proyecto de ciencia de datos para riesgo crediticio"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "pyyaml",
  "joblib"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
